<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 RWD 網頁</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 網頁標題 -->
    <header>
        <h1>我的 RWD 資料網站</h1>
        <p>響應式網頁設計展示</p>
    </header>

    <!-- 最新消息 -->
    <section class="news">
        <h2>📰 最新消息</h2>

        <div class="news-item">
            <h3>網站正式上線</h3>
            <p>本網站提供最新消息與資料分析功能。</p>
        </div>

        <div class="news-item">
            <h3>新增資料分析</h3>
            <p>未來將加入資料圖表，方便使用者查看資料。</p>
        </div>

        <div class="news-item">
            <h3>未來連接 MySQL</h3>
            <p>未來可以將 MySQL 資料庫與網站連接，取得即時資料。</p>
        </div>
    </section>

    <!-- 資料圖表 -->
    <section class="chart-section">
        <h2>📊 資料分析</h2>

        <div class="chart-box">
            <p>未來可連接 MySQL 資料庫顯示圖表</p>

            <div class="chart">
                <div class="bar" style="height: 40%;">
                    <span>1月</span>
                </div>

                <div class="bar" style="height: 60%;">
                    <span>2月</span>
                </div>

                <div class="bar" style="height: 50%;">
                    <span>3月</span>
                </div>

                <div class="bar" style="height: 80%;">
                    <span>4月</span>
                </div>

                <div class="bar" style="height: 70%;">
                    <span>5月</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 頁尾 -->
    <footer>
        <p>© 2026 我的 RWD 網頁</p>
    </footer>

</body>
</html>
